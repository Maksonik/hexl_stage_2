services:
  db:
    image: postgres:16-alpine
    container_name: hexl-partners-db
    environment:
      POSTGRES_DB: partners
      POSTGRES_USER: partners
      POSTGRES_PASSWORD: partners
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - partners_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partners -d partners"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  partners_pg_data:
