<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM: Список партнеров и скидок</title>
  <link rel="icon" href="resources/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page">

    <main class="partners" aria-label="Список партнеров">

          <h2 class="partner-card__title">Розница | ООО Альфа</h2>
          <p class="partner-card__discount">5%</p>
        </div>
        <ul class="partner-card__details">
          <li>Иванов И.И.</li>
          <li>+79001112233</li>
          <li>Рейтинг: 5</li>
        </ul>
      </article>

      <article class="partner-card">
        <div class="partner-card__top">
          <h2 class="partner-card__title">Опт | ООО Бета</h2>
          <p class="partner-card__discount">10%</p>
        </div>
        <ul class="partner-card__details">
          <li>Петров П.П.</li>
          <li>+79004445566</li>
          <li>Рейтинг: 3</li>
        </ul>
      </article>

      <article class="partner-card">
        <div class="partner-card__top">
          <h2 class="partner-card__title">Розница | ООО Гамма</h2>
          <p class="partner-card__discount">0%</p>
        </div>
        <ul class="partner-card__details">
          <li>Сидоров С.С.</li>
          <li>+79007778899</li>
          <li>Рейтинг: 1</li>
        </ul>
      </article>
    </main>
  </div>
</body>
</html>
